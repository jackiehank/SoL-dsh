# SoL-Pi 的 DSH 移植：四个机制都默认关闭，按需打开。
# 配置键与上游 sol-pi 一致（8 个）；阈值不开放，DSH 目录/排障走环境变量：
#   DSH_SOL_DSH_HOME        归档根目录（默认 <DSH_HOME>/sol-pi）
#   DSH_SOL_DSH_DIAGNOSTICS=1  注册 sol_dsh_status 排障工具
- insert:
    - id: sol-dsh
      name: '@local/sol-dsh'
      config:
        version: 1
        # 编辑/写入后在同一调用里跑 then_run（命令走 pwsh，同一套审批与沙箱）。
        actionFusion: false
        # 超过 10 KiB 的纯文本结果换成句柄，原文归档，用 obs_recall 分页读回。
        observationPack: false
        # 诊断日志（≥4 KiB）压成逐字可校验的回执；provider/model 留空 = 默认路由。
        evidencePreservingReducer: false
        evidencePreservingReducerProvider: ''
        evidencePreservingReducerModel: ''
        # 计划完成点触发原生压缩（同一 turn 继续）。
        onlineContextCompact: false
        cacheWriteReadRatio: 12.5
